# Infraestrutura local: PostgreSQL (com pgvector), Kafka (KRaft, um nó) e
# storage compatível com S3 (RustFS). Valores padrão iguais aos do
# .env.example; um .env na raiz sobrescreve.
#
#   docker compose up -d      sobe tudo
#   docker compose ps         status e healthcheck
#   docker compose down       para (os dados ficam nos volumes)
#   docker compose down -v    para e apaga os dados

name: domain-knowledge-ai

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dka}
      POSTGRES_USER: ${POSTGRES_USER:-dka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dka}
    ports:
      - "5432:5432"
    volumes:
      # A partir do Postgres 18 o volume monta em /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.2
    environment:
      # Um nó só fazendo os dois papéis: broker e controller (modo KRaft,
      # sem ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Com um broker só, tudo tem réplica 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Tópicos são criados pela aplicação, de propósito.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 3s
      retries: 24
    mem_limit: 768m
    restart: unless-stopped

  storage:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-dka-access}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-dka-secret-change-me}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # console web
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  storage-data:
