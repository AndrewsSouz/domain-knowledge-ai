spring:
  application:
    name: domain-knowledge-ai
  # Lê o mesmo .env do docker compose, se existir. Sem ele, valem os padrões
  # abaixo, iguais aos do compose.
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # RF1: até 20 MB por arquivo; a requisição inteira tem folga pro título.
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:dka}
    username: ${POSTGRES_USER:dka}
    password: ${POSTGRES_PASSWORD:dka}
  jpa:
    open-in-view: false
    hibernate:
      # O schema é do Flyway; o Hibernate só confere se as entidades batem.
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Só confirma depois que todas as réplicas gravaram; com idempotência, um
      # reenvio automático do cliente não duplica a mensagem.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        # Sem cabeçalho com o nome da classe Java: o consumidor sabe o tipo.
        spring.json.add.type.headers: false
        # Kafka fora do ar não pode prender a requisição: em até 5 s pra achar
        # o broker e 5 s pra confirmar, o upload responde 503 (RF8).
        max.block.ms: 5000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
    consumer:
      # Grupo novo começa do início do tópico: nada enviado antes da primeira
      # subida fica pra trás.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # O ErrorHandlingDeserializer embrulha o JSON: mensagem malformada vira
      # erro tratável em vez de travar a partição pra sempre.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: com.domainknowledge.ingestion.model.DocumentUploadedEvent
        spring.json.use.type.headers: false
    listener:
      # Um consumidor por partição do tópico (3).
      concurrency: 3
      # Confirma o offset de cada mensagem logo depois de processada: se a
      # aplicação cair, só a mensagem em andamento é entregue de novo.
      ack-mode: record

management:
  endpoint:
    health:
      # Mostra o status de cada componente (banco, Kafka, storage). Os detalhes
      # (bucket, id do cluster...) ficam escondidos até ter autenticação
      # (fatia 4): não se expõe a infraestrutura pra qualquer um.
      show-components: always
      show-details: when-authorized

logging:
  pattern:
    # [documentId] depois do nível, quando a linha é do fluxo de um documento
    # (MDC, RNF3); sem documento, não aparece nada.
    level: "%5p%replace( [%X{documentId}]){' \\[\\]', ''}"

server:
  tomcat:
    # Acima do limite, a aplicação responde 413, mas o Tomcat ainda precisa ler
    # (e descartar) o resto do corpo pra o cliente receber a resposta; com o
    # padrão de 2 MB ele corta a conexão e o cliente não vê o 413.
    max-swallow-size: 25MB

# Storage S3 dos originais (RustFS no ambiente local).
storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  bucket: ${STORAGE_BUCKET:documents}
  access-key: ${STORAGE_ACCESS_KEY:dka-access}
  secret-key: ${STORAGE_SECRET_KEY:dka-secret-change-me}
  create-bucket: true
